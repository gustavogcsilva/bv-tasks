databases:
  - name: bv-tasks-sql
    databaseName: bv_tasks
    user: bv_tasks_user
    plan: free

services:
  - type: web
    name: bv-tasks
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bv-tasks-sql
          property: connectionString
