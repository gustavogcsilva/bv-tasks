services:
  - type: web
    name: bv-tasks-pwa
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /sw.js
        name: Service-Worker-Allowed
        value: /
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
