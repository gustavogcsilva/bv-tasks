<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>B V Tasks</title>
    <meta
      name="description"
      content="B V Tasks — Planejamento Executivo com Calendário, Pastas, Câmera/PDFs, Notificações e Sincronização Mobile."
    />

    <!-- Tipografia Executiva Padrão Apple HIG & Inter com fallback nativo de sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Google Identity Services (GSI) para Autenticação Segura -->
    <script src="https://accounts.google.com/gsi/client" async defer id="google-gsi-client"></script>

    <!-- PWA & Theme (Vermelho Vinho e Preto) -->
    <meta name="theme-color" content="#7F1D1D" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Web App Meta Tags (iPhone Safari Standalone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="B V Tasks" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Ícones para iOS, Android e Navegadores -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Script de Autocura e Proteção contra Tela Branca / Cache Legado -->
    <script>
      (function() {
        var APP_VERSION = 'bv-tasks-v6';
        try {
          var storedVersion = localStorage.getItem('__bv_tasks_cache_version__');
          if (storedVersion !== APP_VERSION) {
            localStorage.setItem('__bv_tasks_cache_version__', APP_VERSION);
            if ('caches' in window) {
              caches.keys().then(function(cacheNames) {
                cacheNames.forEach(function(name) {
                  if (name.indexOf(APP_VERSION) === -1) {
                    caches.delete(name);
                  }
                });
              });
            }
          }
        } catch (e) {}

        // Failsafe de tela branca: se após 3s o aplicativo não renderizou nada
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var rootEl = document.getElementById('root');
            if (rootEl && rootEl.childElementCount === 0) {
              console.warn('[B V Tasks] Detectado root vazio. Limpando Service Workers e recarregando...');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  regs.forEach(function(r) { r.unregister(); });
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  names.forEach(function(n) { caches.delete(n); });
                });
              }
              if (!sessionStorage.getItem('__bv_tasks_failsafe_reloaded__')) {
                sessionStorage.setItem('__bv_tasks_failsafe_reloaded__', '1');
                window.location.reload();
              }
            }
          }, 3000);
        });
      })();
    </script>
  </head>
  <body class="bg-[#F8F7F4] text-[#0F0F12] antialiased selection:bg-[#991B1B]/20 dark:bg-[#09090B] dark:text-[#F4F4F5]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
